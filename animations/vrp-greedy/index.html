<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>VRP Greedy Route Visualization (Brazil)</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="map">
    <!-- Brazilian States (nodes) -->
    <div class="state ac r4"></div>
    <div class="state al r2"></div>
    <div class="state am r4"></div>
    <div class="state ap r4"></div>
    <div class="state ba r2"></div>
    <div class="state ce r2"></div>
    <div class="state df r1"></div>
    <div class="state es r1"></div>
    <div class="state go r1"></div>
    <div class="state ma r2"></div>
    <div class="state mg r1"></div>
    <div class="state mt start"></div>
    <div class="state ms r3"></div>
    <div class="state pa r4"></div>
    <div class="state pb r2"></div>
    <div class="state pe r2"></div>
    <div class="state pi r2"></div>
    <div class="state pr r3"></div>
    <div class="state rj r1"></div>
    <div class="state rn r2"></div>
    <div class="state ro r4"></div>
    <div class="state rr r4"></div>
    <div class="state rs r3"></div>
    <div class="state sc r3"></div>
    <div class="state se r2"></div>
    <div class="state sp r1"></div>
    <div class="state to r2"></div>
    <!-- Vehicle 1: Central-West and Southeast -->
    <div class="line vrp r1 medium mt-go"></div>
    <div class="line vrp r1 short  go-df"></div>
    <div class="line vrp r1 medium df-mg"></div>
    <div class="line vrp r1 medium mg-es"></div>
    <div class="line vrp r1 medium es-rj"></div>
    <div class="line vrp r1 medium rj-sp"></div>
    <div class="line vrp r1 long   sp-mt"></div>

    <!-- Vehicle 2: Northeast -->
    <div class="line vrp r2 medium mt-to"></div>
    <div class="line vrp r2 medium to-ma"></div>
    <div class="line vrp r2 medium ma-pi"></div>
    <div class="line vrp r2 medium pi-ce"></div>
    <div class="line vrp r2 short  ce-rn"></div>
    <div class="line vrp r2 short  rn-pb"></div>
    <div class="line vrp r2 short  pb-pe"></div>
    <div class="line vrp r2 short  pe-al"></div>
    <div class="line vrp r2 short  al-se"></div>
    <div class="line vrp r2 medium se-ba"></div>
    <div class="line vrp r2 long   ba-mt"></div>
    <!-- Vehicle 3: South -->
    <div class="line vrp r3 medium mt-ms"></div>
    <div class="line vrp r3 long   ms-pr"></div>
    <div class="line vrp r3 short  pr-sc"></div>
    <div class="line vrp r3 medium sc-rs"></div>
    <div class="line vrp r3 long   rs-mt"></div>
    <!-- Vehicle 4: North -->
    <div class="line vrp r4 medium mt-ro"></div>
    <div class="line vrp r4 medium ro-ac"></div>
    <div class="line vrp r4 medium ac-am"></div>
    <div class="line vrp r4 medium am-rr"></div>
    <div class="line vrp r4 medium rr-ap"></div>
    <div class="line vrp r4 medium ap-pa"></div>
    <div class="line vrp r4 long   pa-mt"></div>

  </div>
</body>

</html>
