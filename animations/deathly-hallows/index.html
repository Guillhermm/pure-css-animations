<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deathly Hallows, by Guilherme Zeni</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main>
    <div class="deathly-hallows">
      <!-- Elder Wand -->
      <div class="elder-wand-wrapper">
        <div class="elder-wand layer layer-0"></div>
        <div class="elder-wand layer layer-1"></div>
        <div class="elder-wand layer layer-2"></div>
        <div class="elder-wand layer layer-3"></div>
        <div class="elder-wand layer layer-4"></div>
        <div class="elder-wand layer layer-5"></div>
        <div class="elder-wand layer layer-6"></div>
        <div class="elder-wand layer layer-7"></div>
        <div class="elder-wand layer layer-8"></div>
        <div class="elder-wand layer layer-9"></div>
        <div class="elder-wand layer layer-10"></div>
        <div class="elder-wand layer layer-11"></div>
        <div class="elder-wand layer layer-12"></div>
      </div>
      <!-- SHARED 3D Space -->
      <div class="relics-3d">
        <!-- Resurrection Stone -->
        <div class="resurrection-stone-wrapper">
          <div class="resurrection-stone layer layer-0"></div>
          <div class="resurrection-stone layer layer-1"></div>
          <div class="resurrection-stone layer layer-2"></div>
          <div class="resurrection-stone layer layer-3"></div>
          <div class="resurrection-stone layer layer-4"></div>
          <div class="resurrection-stone layer layer-5"></div>
          <div class="resurrection-stone layer layer-6"></div>
          <div class="resurrection-stone layer layer-7"></div>
          <div class="resurrection-stone layer layer-8"></div>
          <div class="resurrection-stone layer layer-9"></div>
          <div class="resurrection-stone layer layer-10"></div>
          <div class="resurrection-stone layer layer-11"></div>
          <div class="resurrection-stone layer layer-12"></div>
        </div>
        <div class="cloak-rotation">
          <!-- Invisibility Cloak with Shader -->
          <div class="invisibility-cloak layer layer-0">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-1">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-2">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-3">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-4">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-5">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-6">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-7">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-8">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-9">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-10">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-11">
            <div class="cloak-layer front"></div>
          </div>
          <div class="invisibility-cloak layer layer-12">
            <div class="cloak-layer back"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
