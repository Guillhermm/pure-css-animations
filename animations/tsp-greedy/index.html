<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>TSP Greedy Route Visualization (Brazil), by Guilherme Zeni</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="map">
    <!-- Brazilian States (nodes)-->
    <div class="state ac start" title="Acre"></div>
    <div class="state al" title="Alagoas"></div>
    <div class="state am" title="Amazonas"></div>
    <div class="state ap" title="Amapá"></div>
    <div class="state ba" title="Bahia"></div>
    <div class="state ce" title="Ceará"></div>
    <div class="state df" title="Distrito Federal"></div>
    <div class="state es" title="Espírito Santo"></div>
    <div class="state go" title="Goiás"></div>
    <div class="state ma" title="Maranhão"></div>
    <div class="state mg" title="Minas Gerais"></div>
    <div class="state mt" title="Mato Grosso"></div>
    <div class="state ms" title="Mato Grosso do Sul"></div>
    <div class="state pa" title="Pará"></div>
    <div class="state pb" title="Paraíba"></div>
    <div class="state pe" title="Pernambuco"></div>
    <div class="state pi" title="Piauí"></div>
    <div class="state pr" title="Paraná"></div>
    <div class="state rj" title="Rio de Janeiro"></div>
    <div class="state rn" title="Rio Grande do Norte"></div>
    <div class="state ro" title="Rondônia"></div>
    <div class="state rr" title="Roraima"></div>
    <div class="state rs" title="Rio Grande do Sul"></div>
    <div class="state sc" title="Santa Catarina"></div>
    <div class="state se" title="Sergipe"></div>
    <div class="state sp" title="São Paulo"></div>
    <div class="state to" title="Tocantins"></div>
    <!-- Connection between each pair of States (edges) -->
    <div class="line medium ac-am"></div>
    <div class="line medium am-rr"></div>
    <div class="line long rr-pa"></div>
    <div class="line medium pa-ap"></div>
    <div class="line long ap-ma"></div>
    <div class="line medium ma-pi"></div>
    <div class="line medium pi-ce"></div>
    <div class="line short ce-rn"></div>
    <div class="line short rn-pb"></div>
    <div class="line short pb-pe"></div>
    <div class="line short pe-al"></div>
    <div class="line short al-se"></div>
    <div class="line medium se-ba"></div>
    <div class="line medium ba-es"></div>
    <div class="line medium es-mg"></div>
    <div class="line medium mg-rj"></div>
    <div class="line medium rj-sp"></div>
    <div class="line short sp-pr"></div>
    <div class="line short pr-sc"></div>
    <div class="line medium sc-rs"></div>
    <div class="line long rs-ms"></div>
    <div class="line medium ms-go"></div>
    <div class="line short go-df"></div>
    <div class="line medium df-mt"></div>
    <div class="line long mt-to"></div>
    <div class="line long to-ro"></div>
    <div class="line medium ro-ac"></div>
  </div>
</body>
</html>
